<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>p5.play viewer</title>
<link rel="stylesheet" href="./codemirror/codemirror.min.css">
<script src="./codemirror/codemirror.min.js"></script>
<script src="./codemirror/javascript.min.js"></script>
<script src="./codemirror/active-line.min.js"></script>
<style>
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    background: #fafafa;
    color: #222;
    display: flex;
    flex-direction: column;
  }
  header {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 10px 16px;
    border-bottom: 1px solid #e5e5e5;
    background: #fff;
  }
  header h1 {
    font-size: 15px;
    font-weight: 600;
    margin: 0;
    letter-spacing: 0.2px;
  }
  header .spacer { flex: 1; }
  header .hint {
    font-size: 12px;
    color: #888;
    margin-right: 8px;
  }
  header input[type="text"] {
    font: inherit;
    font-size: 12px;
    padding: 6px 10px;
    border: 1px solid #ddd;
    border-radius: 6px;
    background: #fff;
    color: #333;
    width: 320px;
    font-family: "SF Mono", Menlo, Monaco, Consolas, monospace;
  }
  header input[type="text"]:focus {
    outline: none;
    border-color: #4078f2;
    box-shadow: 0 0 0 2px rgba(64,120,242,0.15);
  }
  button {
    font: inherit;
    font-size: 13px;
    padding: 6px 14px;
    border: 1px solid #ddd;
    background: #fff;
    border-radius: 6px;
    cursor: pointer;
    color: #333;
    transition: background 0.1s, border-color 0.1s;
  }
  button:hover { background: #f3f3f3; border-color: #ccc; }
  button.primary {
    background: #111;
    color: #fff;
    border-color: #111;
  }
  button.primary:hover { background: #333; border-color: #333; }
  button.primary.stop {
    background: #c0392b;
    border-color: #c0392b;
  }
  button.primary.stop:hover { background: #d44a3a; border-color: #d44a3a; }
  main {
    flex: 1;
    display: grid;
    grid-template-columns: 1fr 1fr;
    min-height: 0;
  }
  .pane {
    display: flex;
    flex-direction: column;
    min-width: 0;
    min-height: 0;
  }
  .pane.editor { border-right: 1px solid #e5e5e5; }
  .pane-header {
    padding: 8px 14px;
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 0.6px;
    color: #999;
    background: #fff;
    border-bottom: 1px solid #f0f0f0;
  }
  .CodeMirror {
    flex: 1;
    height: auto;
    font-family: "SF Mono", Menlo, Monaco, Consolas, monospace;
    font-size: 13px;
    line-height: 1.55;
    background: #fff;
    color: #1a1a1a;
  }
  .CodeMirror-gutters { background: #fafafa; border-right: 1px solid #f0f0f0; }
  .CodeMirror-linenumber { color: #bbb; padding: 0 8px 0 6px; }
  .CodeMirror-activeline-background { background: #fcfcfc; }
  .CodeMirror-activeline-gutter .CodeMirror-linenumber { color: #777; }
  .CodeMirror .cm-keyword { color: #a626a4; }
  .CodeMirror .cm-def, .CodeMirror .cm-variable-2 { color: #1a1a1a; }
  .CodeMirror .cm-variable { color: #1a1a1a; }
  .CodeMirror .cm-number { color: #986801; }
  .CodeMirror .cm-string { color: #50a14f; }
  .CodeMirror .cm-comment { color: #a0a1a7; font-style: italic; }
  .CodeMirror .cm-property { color: #4078f2; }
  .CodeMirror .cm-operator { color: #383a42; }
  .CodeMirror .cm-atom { color: #c18401; }
  .CodeMirror .cm-meta { color: #383a42; }
  .CodeMirror .error-line { background: #fff0f0; }
  .CodeMirror-gutter-elt.error-gutter {
    color: #c0392b;
    font-weight: 700;
  }
  .error-line-marker {
    color: #c0392b;
    font-weight: 700;
  }
  .preview-wrap {
    flex: 1;
    position: relative;
    background: #f0f0f0;
    overflow: hidden;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 12px;
  }
  .viewer-box {
    position: relative;
    background: #f0f0f0;
    border: 3px solid #222;
    transition: border-color 0.15s;
    flex: 0 0 auto;
  }
  .viewer-box.ok    { border-color: #27ae60; }
  .viewer-box.error { border-color: #c0392b; }
  iframe {
    width: 100%;
    height: 100%;
    border: none;
    background: #f0f0f0;
    display: block;
  }
  .console-panel {
    height: 110px;
    overflow-y: auto;
    font-family: "SF Mono", Menlo, Monaco, Consolas, monospace;
    font-size: 11.5px;
    background: #fff;
    border-top: 1px solid #f0f0f0;
    padding: 3px 0;
    flex-shrink: 0;
  }
  .console-panel:empty::after {
    content: "Console";
    display: block;
    padding: 6px 14px;
    color: #ccc;
    font-size: 11px;
  }
  .con-entry {
    padding: 1px 14px;
    line-height: 1.5;
    white-space: pre-wrap;
    word-break: break-all;
  }
  .con-entry.log   { color: #555; }
  .con-entry.warn  { color: #c67c10; }
  .con-entry.error { color: #c0392b; }
  .con-entry.info  { color: #4078f2; }
</style>
</head>
<body>

<header>
  <h1>p5.play viewer</h1>
  <input id="import-url" type="text" placeholder="Paste a code.org GameLab project URL…" spellcheck="false" autocomplete="off" />
  <button id="import-btn" title="Fetch source + animations from code.org">Import</button>
  <span class="spacer"></span>
  <span class="hint">⌘/Ctrl + Enter to run</span>
  <button id="reset-btn" title="Restore the starter example">Reset</button>
  <button id="run-btn" class="primary">Run ▶</button>
</header>

<main>
  <section class="pane editor">
    <div class="pane-header">Your code</div>
    <textarea id="code" spellcheck="false" autocomplete="off" autocorrect="off" autocapitalize="off"></textarea>
  </section>
  <section class="pane">
    <div class="pane-header">Preview</div>
    <div id="preview-wrap" class="preview-wrap">
      <div id="viewer-box" class="viewer-box">
        <iframe id="sketch" title="sketch preview"></iframe>
      </div>
    </div>
    <div id="console" class="console-panel"></div>
  </section>
</main>

<script>
  const EXAMPLE = `// Paste your Code.org GameLab / p5.play code here.
// Press Run (or Cmd/Ctrl + Enter).
//
// Animations from your project's asset library render as
// labeled placeholder boxes — sized by sprite.scale.

World.frameRate = 30;

var ball = createSprite(200, 200, 40, 40);
ball.shapeColor = "tomato";
ball.velocityX = 3;
ball.velocityY = 2.2;

var label = createSprite(200, 40);
label.setAnimation("hello");
label.scale = 0.5;

function draw() {
  background("#fafafa");

  if (ball.x < 20 || ball.x > 380) ball.velocityX *= -1;
  if (ball.y < 20 || ball.y > 380) ball.velocityY *= -1;

  drawSprites();

  fill("black");
  textSize(13);
  text("Use arrow keys to nudge the box", 12, 380);
  if (keyDown("left"))  ball.x -= 4;
  if (keyDown("right")) ball.x += 4;
  if (keyDown("up"))    ball.y -= 4;
  if (keyDown("down"))  ball.y += 4;
}
`;

  const STORAGE_KEY = "p5play-viewer-code";
  const ANIMS_KEY = "p5play-viewer-animations";
  const codeEl = document.getElementById("code");
  const iframe = document.getElementById("sketch");
  const runBarEl = document.getElementById("viewer-box");
  const previewWrapEl = document.getElementById("preview-wrap");

  // Keep the viewer box sized as the largest square that fits the preview
  // pane, so its border tightly hugs the canvas (which scales to fill it).
  function fitViewerBox() {
    const w = previewWrapEl.clientWidth - 24;
    const h = previewWrapEl.clientHeight - 24;
    const s = Math.max(80, Math.min(w, h));
    runBarEl.style.width = s + "px";
    runBarEl.style.height = s + "px";
  }
  new ResizeObserver(fitViewerBox).observe(previewWrapEl);
  fitViewerBox();
  const consoleEl = document.getElementById("console");
  const runBtn = document.getElementById("run-btn");
  const resetBtn = document.getElementById("reset-btn");
  const importUrlEl = document.getElementById("import-url");
  const importBtn = document.getElementById("import-btn");

  // Map of animation name -> { url, frameCount, frameSize:{x,y} }, populated by import.
  let projectAnimations = JSON.parse(localStorage.getItem(ANIMS_KEY) || "{}");

  codeEl.value = localStorage.getItem(STORAGE_KEY) || EXAMPLE;

  const cm = CodeMirror.fromTextArea(codeEl, {
    mode: "javascript",
    lineNumbers: true,
    styleActiveLine: true,
    tabSize: 2,
    indentUnit: 2,
    indentWithTabs: false,
    lineWrapping: false,
    extraKeys: {
      "Cmd-Enter": run,
      "Ctrl-Enter": run,
      "Tab": (cmInst) => cmInst.replaceSelection("  ", "end"),
    },
  });

  cm.on("change", () => {
    localStorage.setItem(STORAGE_KEY, cm.getValue());
    clearErrorLine();
  });

  function getCode() { return cm.getValue(); }
  function setCode(v) { cm.setValue(v); }

  let errorLineMarker = null;
  function clearErrorLine() {
    if (errorLineMarker != null) {
      cm.removeLineClass(errorLineMarker, "background", "error-line");
      cm.removeLineClass(errorLineMarker, "gutter", "error-gutter");
      cm.setGutterMarker(errorLineMarker, "CodeMirror-linenumbers", null);
      errorLineMarker = null;
    }
  }
  function markErrorLine(line) {
    clearErrorLine();
    if (!line || line < 1 || line > cm.lineCount()) return;
    const idx = line - 1;
    cm.addLineClass(idx, "background", "error-line");
    cm.addLineClass(idx, "gutter", "error-gutter");
    cm.scrollIntoView({ line: idx, ch: 0 }, 120);
    errorLineMarker = idx;
  }

  function setRunBar(state) {
    runBarEl.classList.remove("ok", "error");
    if (state) runBarEl.classList.add(state);
  }

  function clearConsole() {
    consoleEl.innerHTML = "";
  }

  function addConsoleLine(text, kind) {
    const el = document.createElement("div");
    el.className = "con-entry " + (kind || "log");
    el.textContent = text;
    consoleEl.appendChild(el);
    consoleEl.scrollTop = consoleEl.scrollHeight;
  }

  function setStatus(text, kind) {
    if (kind === "error") {
      setRunBar("error");
      addConsoleLine(text, "error");
    } else if (kind === "ok") {
      setRunBar("ok");
    } else {
      setRunBar("");
    }
  }

  function buildSrcdoc(userCode, animations) {
    // Escape closing-script sequences in the user code so it can't break out
    // of the <script type="text/plain"> block it gets embedded in.
    const safe = userCode.replace(/<\/script/gi, "<\\/script");
    const animsJson = JSON.stringify(animations || {})
      .replace(/</g, "\\u003c")
      .replace(/-->/g, "--\\u003e");
    return `<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<style>
  html, body { margin: 0; padding: 0; height: 100%; background: #f0f0f0; overflow: hidden; }
  body { font-family: -apple-system, BlinkMacSystemFont, sans-serif; color: #777; }
  canvas {
    display: block;
    position: fixed;
    top: 50%;
    left: 50%;
    transform-origin: center center;
    transform: translate(-50%, -50%);
    box-shadow: 0 1px 4px rgba(0,0,0,0.08);
  }
</style>
<script src="./p5.min.js"><\/script>
<script>
  // ----- Polyfills for code.org's p5.js fork features that the fork-p5.play depends on -----
  //
  // 1. alphaTint — pInstBound during Sprite construction.
  p5.prototype.alphaTint = function(a) { this.tint(255, 255, 255, a * 255); };
  //
  // 2. _updateTouchCoords called with NO arguments (p5.play.js:265, "make previous
  //    and next equal" branch). Stock p5's version expects an event and reads
  //    e.touches, crashing on the first mousedown. Replace with a safe sync of
  //    next-to-prev touch coords that works whether or not an event is passed.
  p5.prototype._updateTouchCoords = function(e) {
    this._setProperty("ptouchX", this.touchX);
    this._setProperty("ptouchY", this.touchY);
    this._setProperty("pwinTouchX", this.winTouchX);
    this._setProperty("pwinTouchY", this.winTouchY);
  };
  // 3. Same fix for the mouse-coord counterpart, which p5.play also calls
  //    parameterless on the first-frame branch immediately below.
  var _origUpdateMouseCoords = p5.prototype._updateMouseCoords;
  p5.prototype._updateMouseCoords = function(e) {
    if (e === undefined) {
      this._setProperty("pmouseX", this.mouseX);
      this._setProperty("pmouseY", this.mouseY);
      this._setProperty("pwinMouseX", this.winMouseX);
      this._setProperty("pwinMouseY", this.winMouseY);
      return;
    }
    return _origUpdateMouseCoords.call(this, e);
  };
<\/script>
<script src="./p5.play.js"><\/script>
</head>
<body>

<script id="user-code" type="text/plain">${safe}<\/script>
<script id="animations-data" type="application/json">${animsJson}<\/script>

<script>
  // ------- Error reporting to the parent window -------
  // The user's code is run via indirect eval, so V8/SpiderMonkey/JSC report
  // its stack frames as "<anonymous>:LINE:COL". Pull the FIRST such frame
  // out of the stack — that's the user's call site.
  function _extractUserLine(err) {
    if (!err) return null;
    var stack = err.stack || "";
    var m = stack.match(/<anonymous>:(\\d+):(\\d+)/);
    if (m) return { line: parseInt(m[1], 10), col: parseInt(m[2], 10) };
    // SyntaxErrors from eval sometimes carry line/col directly:
    if (typeof err.lineNumber === "number") {
      return { line: err.lineNumber, col: err.columnNumber || 1 };
    }
    return null;
  }
  function _reportError(err) {
    var loc = _extractUserLine(err);
    parent.postMessage({
      type: "sketch-error",
      message: (err && err.message) || String(err),
      line: loc ? loc.line : null,
      col:  loc ? loc.col  : null
    }, "*");
  }
  window.addEventListener("error", function(e) {
    // e.filename is "<anonymous>" for eval'd code, which is what we want to surface.
    var fromUser = !e.filename || e.filename === "<anonymous>" || e.filename === "";
    parent.postMessage({
      type: "sketch-error",
      message: e.message,
      line: fromUser ? e.lineno : null,
      col:  fromUser ? e.colno  : null
    }, "*");
  });
  window.addEventListener("unhandledrejection", function(e) {
    _reportError(e.reason);
  });

  // ------- Console relay to parent -------
  (function() {
    var levels = ["log", "warn", "error", "info"];
    levels.forEach(function(level) {
      var orig = console[level].bind(console);
      console[level] = function() {
        var args = Array.prototype.slice.call(arguments);
        var text = args.map(function(a) {
          if (a === null) return "null";
          if (a === undefined) return "undefined";
          try { return typeof a === "object" ? JSON.stringify(a) : String(a); }
          catch (_) { return String(a); }
        }).join(" ");
        parent.postMessage({ type: "sketch-console", level: level, text: text }, "*");
        orig.apply(console, arguments);
      };
    });
  })();

  // ------- GameLab globals that p5.play (Code.org fork) doesn't itself provide -------
  // Source: code-dot-org/code-dot-org apps/src/dropletUtilsGlobalFunctions.js

  // randomNumber: integer in [min, max] inclusive. Single-arg form → [0, max].
  window.randomNumber = function(min, max) {
    if (max === undefined) { max = min; min = 0; }
    return Math.floor(Math.random() * (~~max - ~~min + 1)) + ~~min;
  };

  // getTime: millis since epoch (used by some GameLab projects for timing)
  window.getTime = function() { return Date.now(); };

  // Deterministic pastel HSL color from a string, for animation placeholders
  function _colorFromName(name) {
    var h = 0;
    for (var i = 0; i < name.length; i++) h = (h * 31 + name.charCodeAt(i)) >>> 0;
    return "hsl(" + (h % 360) + ", 55%, 65%)";
  }

  // Animations imported from a code.org project: { name: { url, frameCount, frameSize } }
  var _projectAnimations = {};
  try { _projectAnimations = JSON.parse(document.getElementById("animations-data").textContent) || {}; } catch (_) {}
  var _hasProjectAnimations = Object.keys(_projectAnimations).length > 0;

  // p5 preload() runs before setup() and blocks setup until all loadImage calls
  // resolve. We populate _predefinedSpriteAnimations on the p5 instance — that
  // is where Sprite.setAnimation(name) looks (p5.play Sprite constructor
  // reads pInst._predefinedSpriteAnimations[name]). In global mode "this"
  // inside window.preload is window, not the p5 instance, so we resolve the
  // instance explicitly via p5.instance.
  window.preload = function() {
    if (!_hasProjectAnimations) return;
    var pInst = (typeof p5 !== "undefined" && p5.instance) || this;
    pInst._predefinedSpriteAnimations = pInst._predefinedSpriteAnimations || {};
    Object.keys(_projectAnimations).forEach(function(name) {
      var meta = _projectAnimations[name];
      if (meta.frameCount > 1 && meta.frameSize && meta.frameSize.x && meta.frameSize.y) {
        // Multi-frame: slice the sheet into per-frame p5.Image objects
        // and hand them to Animation in "arbitrary list of images" mode.
        //
        // We do NOT use p5.play's SpriteSheet/Animation sprite-sheet path
        // because p5.play passes args to p5.image() in (sx, sy, sW, sH,
        // dx, dy, dW, dH) order, while stock p5 (v1.4.2) expects
        // (dx, dy, dW, dH, sx, sy, sW, sH). The mismatch makes any frame
        // whose source y > 0 draw off-canvas. Pre-slicing via p5.Image.get
        // sidesteps the broken path entirely.
        //
        // Code.org sheets aren't always horizontal — "fraud" is a 1×N
        // vertical strip, "North Korea Nuked" is a 2-col × 5-row grid
        // for 9 frames. Derive column count from the loaded image's
        // actual width so wrapping matches the original layout. The
        // loadImage callback runs while the p5 preload counter is still
        // pending, so setup() blocks until each animation is registered.
        pInst.loadImage(meta.url, function(loadedImg) {
          var fw = meta.frameSize.x;
          var fh = meta.frameSize.y;
          var cols = Math.max(1, Math.floor(loadedImg.width / fw));
          var anim = new pInst.Animation();
          for (var i = 0; i < meta.frameCount; i++) {
            var col = i % cols;
            var row = (i / cols) | 0;
            anim.images.push(loadedImg.get(col * fw, row * fh, fw, fh));
          }
          pInst._predefinedSpriteAnimations[name] = anim;
        });
      } else {
        var img = pInst.loadImage(meta.url);
        var anim = new pInst.Animation(img);
        if (meta.frameSize && meta.frameSize.x && meta.frameSize.y) {
          anim.frameSize = { width: meta.frameSize.x, height: meta.frameSize.y };
        }
        pInst._predefinedSpriteAnimations[name] = anim;
      }
    });
  };

  // ------- The user's code runs inside setup() at GLOBAL scope -------
  // GameLab's execution model: top-level user code IS the setup body, draw()
  // is optional. drawSprites/createSprite/etc. are only on window AFTER p5
  // initializes, so the user's top-level calls have to happen from inside setup.
  window.setup = function() {
    // GameLab auto-creates a 400×400 canvas before user code runs.
    createCanvas(400, 400);

    // Scale the canvas (whose drawing-buffer size and CSS size are fixed by
    // createCanvas) to fit the iframe, preserving aspect ratio. Use the CSS
    // size — not the HiDPI-doubled buffer size — as the base.
    (function() {
      var c = document.querySelector("canvas");
      if (!c) return;
      function _fit() {
        var cssW = parseFloat(c.style.width) || c.offsetWidth;
        var cssH = parseFloat(c.style.height) || c.offsetHeight;
        if (!cssW || !cssH) return;
        var s = Math.min(window.innerWidth / cssW, window.innerHeight / cssH);
        if (s < 0.1) s = 0.1;
        c.style.transform = "translate(-50%, -50%) scale(" + s + ")";
      }
      _fit();
      window.addEventListener("resize", _fit);
    })();

    // Game is an alias for World, kept for older GameLab/blocks compatibility.
    // Source: code-dot-org/code-dot-org apps/src/p5lab/P5Wrapper.js:541
    if (typeof World !== "undefined") window.Game = World;

    if (!_hasProjectAnimations) {
      // Without the project's uploaded animations we can't render real images,
      // so override setAnimation to render a labeled placeholder rectangle.
      var _origCreateSprite = window.createSprite;
      window.createSprite = function(x, y, w, h) {
        var s = _origCreateSprite(x, y, w, h);
        s.setAnimation = function(name) {
          this._animationName = name;
          this.shapeColor = _colorFromName(name);
        };
        return s;
      };

      // Annotate each placeholder with its animation name on top of drawSprites.
      var _origDrawSprites = window.drawSprites;
      window.drawSprites = function() {
        _origDrawSprites.apply(this, arguments);
        push();
        textAlign(CENTER, CENTER);
        textSize(10);
        noStroke();
        fill(40, 200);
        var group = (typeof allSprites !== "undefined" && allSprites) ? allSprites : [];
        for (var i = 0; i < group.length; i++) {
          var s = group[i];
          if (s && s.visible && s._animationName) {
            text(s._animationName, s.position.x, s.position.y);
          }
        }
        pop();
      };
    }

    // Run user code at global scope so var/function become window properties.
    var _ourSetup = window.setup;
    try {
      var userCode = document.getElementById("user-code").textContent;
      (0, eval)(userCode);
    } catch (err) {
      _reportError(err);
      noLoop();
      return;
    }

    // If the user code defined its own setup(), call it now (GameLab allows
    // both top-level code AND a setup() function).
    if (typeof window.setup === "function" && window.setup !== _ourSetup) {
      try { window.setup(); }
      catch (err) { _reportError(err); noLoop(); return; }
    }

    // Wrap user's draw so per-frame errors report with their actual line:col.
    // Without this, the error bubbles to window.onerror which on some browsers
    // loses the column info.
    if (typeof window.draw === "function") {
      var _userDraw = window.draw;
      var _drawErrored = false;
      window.draw = function() {
        if (_drawErrored) return;
        try { return _userDraw.apply(this, arguments); }
        catch (err) {
          _drawErrored = true;
          _reportError(err);
          noLoop();
        }
      };
    }

    parent.postMessage({ type: "sketch-ok" }, "*");
  };
<\/script>

</body>
</html>`;
  }

  let isRunning = false;
  function setRunButton(running) {
    isRunning = running;
    if (running) {
      runBtn.textContent = "Stop ■";
      runBtn.classList.add("stop");
    } else {
      runBtn.textContent = "Run ▶";
      runBtn.classList.remove("stop");
    }
  }

  function run() {
    clearErrorLine();
    clearConsole();
    setRunBar("");
    setRunButton(true);
    iframe.srcdoc = buildSrcdoc(getCode(), projectAnimations);
  }

  function stop() {
    iframe.srcdoc = "";
    setRunBar("");
    setRunButton(false);
  }

  // Pull the channel ID out of any reasonable code.org project URL.
  // Accepts forms like:
  //   https://studio.code.org/projects/gamelab/{id}
  //   https://studio.code.org/projects/gamelab/{id}/edit
  //   https://studio.code.org/projects/gamelab/{id}/view
  //   just the bare UUID
  function parseChannelId(input) {
    if (!input) return null;
    const trimmed = input.trim();
    const uuidLike = /([0-9a-f-]{8,})/i;
    const fromUrl = trimmed.match(/projects\/[a-z]+\/([^/?#]+)/i);
    if (fromUrl) return fromUrl[1];
    const bare = trimmed.match(uuidLike);
    return bare ? bare[1] : null;
  }

  async function importProject(url) {
    const channelId = parseChannelId(url);
    if (!channelId) {
      setStatus("Couldn't parse a project ID from that URL.", "error");
      return;
    }
    setStatus("Fetching project " + channelId + "…");
    try {
      const res = await fetch("/codeorg/v3/sources/" + encodeURIComponent(channelId) + "/main.json");
      if (!res.ok) throw new Error("HTTP " + res.status + " fetching source");
      const data = await res.json();
      const source = data.source || "";
      const anims = (data.animations && data.animations.propsByKey) || {};

      // Build the name -> URL map for the iframe.
      const nameMap = {};
      Object.keys(anims).forEach((key) => {
        const a = anims[key];
        if (!a || !a.name) return;
        const v = a.version ? "?version=" + encodeURIComponent(a.version) : "";
        // sourceUrl is set when the animation lives in the shared library;
        // otherwise it's stored under this project's own channel.
        const path = a.sourceUrl
          ? a.sourceUrl
          : "/v3/animations/" + channelId + "/" + key + ".png" + v;
        nameMap[a.name] = {
          url: "/codeorg" + (path.startsWith("/") ? path : "/" + path),
          frameCount: a.frameCount || 1,
          frameSize: a.frameSize || null,
        };
      });

      projectAnimations = nameMap;
      localStorage.setItem(ANIMS_KEY, JSON.stringify(nameMap));
      setCode(source);
      const count = Object.keys(nameMap).length;
      setStatus("Imported. " + count + " animation" + (count === 1 ? "" : "s") + " linked. Running…", "ok");
      run();
    } catch (err) {
      setStatus("Import failed: " + err.message, "error");
    }
  }

  window.addEventListener("message", (e) => {
    const data = e.data || {};
    if (data.type === "sketch-error") {
      const where = data.line ? ` (line ${data.line}${data.col ? ":" + data.col : ""})` : "";
      setStatus("Error: " + data.message + where, "error");
      setRunButton(false);
      if (data.line) markErrorLine(data.line);
    } else if (data.type === "sketch-ok") {
      setRunBar("ok");
      setRunButton(true);
      clearErrorLine();
    } else if (data.type === "sketch-console") {
      addConsoleLine(data.text, data.level);
    }
  });

  runBtn.addEventListener("click", () => { isRunning ? stop() : run(); });
  resetBtn.addEventListener("click", () => {
    if (confirm("Replace the editor contents with the starter example?")) {
      setCode(EXAMPLE);
      localStorage.setItem(STORAGE_KEY, EXAMPLE);
      projectAnimations = {};
      localStorage.removeItem(ANIMS_KEY);
      run();
    }
  });
  importBtn.addEventListener("click", () => importProject(importUrlEl.value));
  importUrlEl.addEventListener("keydown", (e) => {
    if (e.key === "Enter") importProject(importUrlEl.value);
  });

  // Document-level shortcut still works when focus is outside the editor
  // (CodeMirror handles Cmd/Ctrl+Enter inside it via extraKeys).
  document.addEventListener("keydown", (e) => {
    if ((e.metaKey || e.ctrlKey) && e.key === "Enter") {
      e.preventDefault();
      run();
    }
  });

  // Auto-run on first load
  run();
</script>

</body>
</html>
